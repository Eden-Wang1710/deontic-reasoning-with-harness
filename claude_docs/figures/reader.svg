<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 290" width="770" height="290" role="img" aria-label="The solver sends a query to the reader, the reader searches the rule file and returns line ranges, the harness copies those lines verbatim to the solver." font-family="Arial, Helvetica, sans-serif">
<defs><marker id="rd-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2530"/></marker><marker id="rd-aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b6e69"/></marker></defs>
<rect x="20" y="110" width="170" height="70" rx="6" stroke-width="1.5" fill="#ffffff" stroke="#1c2530"/>
<text x="105.0" y="142.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1c2530">Solver</text>
<text x="105.0" y="160.0" font-size="11" font-weight="400" text-anchor="middle" fill="#5d6a79">never opens the rule file</text>
<rect x="300" y="40" width="170" height="70" rx="6" stroke-width="1.5" fill="#ffffff" stroke="#1c2530"/>
<text x="385.0" y="72.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1c2530">Reader</text>
<text x="385.0" y="90.0" font-size="11" font-weight="400" text-anchor="middle" fill="#5d6a79">fresh context</text>
<rect x="580" y="40" width="170" height="70" rx="6" stroke-width="1.5" fill="#ffffff" stroke="#1c2530"/>
<text x="665.0" y="72.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1c2530">Rule file</text>
<text x="665.0" y="90.0" font-size="11" font-weight="400" text-anchor="middle" fill="#5d6a79">statute.txt</text>
<rect x="300" y="190" width="170" height="70" rx="6" stroke-width="1.5" fill="#ffffff" stroke="#1c2530"/>
<text x="385.0" y="222.0" font-size="14" font-weight="600" text-anchor="middle" fill="#1c2530">Harness</text>
<text x="385.0" y="240.0" font-size="11" font-weight="400" text-anchor="middle" fill="#5d6a79">plain code, no model</text>
<path d="M190,125 L245,125 L245,75 L298,75" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#rd-a)" fill="none" stroke="#1c2530"/>
<circle cx="226.0" cy="56" r="9" fill="#1c2530"/>
<text x="226.0" y="60" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="241.0" y="60" font-size="12" font-weight="500" text-anchor="start" fill="#1c2530">query</text>
<path d="M470,75 L578,75" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#rd-a)" fill="none" stroke="#1c2530"/>
<circle cx="502.8" cy="58" r="9" fill="#1c2530"/>
<text x="502.8" y="62" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="517.8" y="62" font-size="12" font-weight="500" text-anchor="start" fill="#1c2530">search</text>
<text x="525" y="93" font-size="11" font-weight="400" text-anchor="middle" fill="#5d6a79">≤ 3 commands</text>
<path d="M385,110 L385,188" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#rd-a)" fill="none" stroke="#1c2530"/>
<circle cx="401.8" cy="150" r="9" fill="#1c2530"/>
<text x="401.8" y="154" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="416.8" y="154" font-size="12" font-weight="500" text-anchor="start" fill="#1c2530">line ranges</text>
<path d="M665,110 L665,225 L472,225" stroke-width="2" stroke-linejoin="round" marker-end="url(#rd-aa)" fill="none" stroke="#0b6e69"/>
<circle cx="513.8" cy="208" r="9" fill="#0b6e69"/>
<text x="513.8" y="212" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="528.8" y="212" font-size="12" font-weight="500" text-anchor="start" fill="#0b6e69">copy those lines</text>
<path d="M300,225 L245,225 L245,165 L192,165" stroke-width="2" stroke-linejoin="round" marker-end="url(#rd-aa)" fill="none" stroke="#0b6e69"/>
<circle cx="200.4" cy="243" r="9" fill="#0b6e69"/>
<text x="200.4" y="247" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<text x="215.4" y="247" font-size="12" font-weight="500" text-anchor="start" fill="#0b6e69">verbatim text</text>
</svg>
